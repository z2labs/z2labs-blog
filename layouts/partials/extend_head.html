{{ if or .Params.math .Site.Params.math }}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
  onload="renderMathInElement(document.body,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}]});"></script>
{{ end }}
<style>
  .post-content { max-width: 900px; }          /* wider than PaperMod's default */
  .post-content figure figcaption { font-size: .9em; color: var(--secondary); margin-top: .4rem; }
  .post-content table { display: table; width: 100%; font-size: .92em; }
  .post-content pre { white-space: pre-wrap; word-break: break-word; }
</style>
<style>.post-content figure.portrait img { max-height: 70vh; width: auto; margin: 0 auto; display: block; }</style>
